<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Enter a FreeBookery invitation code." />
    <title>Enter Invite | FreeBookery</title>
    <link rel="icon" type="image/png" href="/assets/book-logo.png" />
    <style>
      :root {
        --ink: #100b2b;
        --ink-soft: #20183f;
        --paper: #f7f2e7;
        --cream: #fffaf0;
        --gold: #f2d6a4;
        --muted: #6f687b;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; overscroll-behavior-y: none; }
      html { background: var(--ink); }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: clamp(52px, 5.5vw, 70px);
        padding: 2px clamp(22px, 5vw, 88px);
        background: var(--ink);
        color: var(--cream);
        box-shadow: 0 10px 30px rgba(16, 11, 43, 0.18);
      }

      .site-header a { color: var(--cream); text-decoration: none; font-weight: 650; }
      .site-header a:hover, .site-header a:focus-visible { color: var(--gold); }
      .back-link { position: absolute; left: clamp(22px, 5vw, 88px); }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-size: clamp(1.4rem, 2vw, 2.2rem); font-weight: 750; }
      .brand-logo { width: clamp(40px, 4vw, 56px); height: clamp(40px, 4vw, 56px); object-fit: contain; }

      main {
        display: grid;
        min-height: calc(100vh - clamp(52px, 5.5vw, 70px));
        place-items: center;
        padding: 36px 20px;
      }

      .invite-card {
        width: min(100%, 520px);
        padding: clamp(30px, 5vw, 48px);
        border-radius: 18px;
        background: linear-gradient(145deg, var(--ink), var(--ink-soft));
        color: var(--cream);
        box-shadow: 0 24px 60px rgba(16, 11, 43, 0.2);
        text-align: center;
      }

      .invite-card h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 3.5rem); line-height: 1.05; }
      .invite-card > p { margin: 16px auto 28px; color: rgba(255, 250, 240, 0.75); line-height: 1.6; }
      form { display: grid; gap: 14px; text-align: left; }
      label { font-weight: 750; }
      input, button { width: 100%; min-height: 52px; border-radius: 8px; font: inherit; }
      input {
        border: 1px solid rgba(255, 250, 240, 0.42);
        background: rgba(255, 250, 240, 0.08);
        color: var(--cream);
        padding: 0 16px;
      }
      input::placeholder { color: rgba(255, 250, 240, 0.52); }
      input:focus, button:focus-visible, a:focus-visible { outline: 3px solid rgba(242, 214, 164, 0.58); outline-offset: 3px; }
      button { border: 0; background: var(--paper); color: var(--ink); cursor: pointer; font-weight: 850; }
      button:hover { background: var(--gold); }
      button:disabled { cursor: wait; opacity: 0.72; }
      .form-status { min-height: 1.4em; margin: 0; color: var(--gold); text-align: center; font-size: 0.94rem; font-weight: 700; }

      @media (max-width: 560px) {
        .site-header { justify-content: flex-end; padding-inline: 18px; }
        .back-link { left: 18px; }
        .brand { gap: 6px; font-size: 1.1rem; }
        .brand-logo { width: 34px; height: 34px; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="back-link" href="/">← Back</a>
      <a class="brand" href="/" aria-label="FreeBookery home">
        <img src="/assets/book-logo.png" alt="" class="brand-logo" />
        <span>FreeBookery</span>
      </a>
    </header>

    <main>
      <section class="invite-card" aria-labelledby="invite-title">
        <h1 id="invite-title">Enter your invite</h1>
        <p>If you received an invitation to preview Free Bookery, enter its code below.</p>
        <form id="invite-form">
          <label for="invite-code">Invite code</label>
          <input id="invite-code" name="code" type="password" autocomplete="one-time-code" maxlength="200" placeholder="Enter your code" required />
          <button type="submit">Continue to Free Bookery</button>
          <p class="form-status" id="invite-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script>
      const form = document.querySelector("#invite-form");
      const codeInput = document.querySelector("#invite-code");
      const status = document.querySelector("#invite-status");
      const button = form.querySelector('button[type="submit"]');

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Checking…";
        status.textContent = "";

        try {
          const response = await fetch("/api/invite", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: codeInput.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "That invite code is not valid.");
          status.textContent = "Invite accepted. Redirecting…";
          window.location.assign(result.redirectUrl);
        } catch (error) {
          status.textContent = error.message || "The invite could not be checked. Please try again.";
          codeInput.select();
          button.disabled = false;
          button.textContent = "Continue to Free Bookery";
        }
      });
    </script>
  </body>
</html>
